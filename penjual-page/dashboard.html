<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABANGDOR - Dashboard Kasir</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-penjual.css">
    
</head>
<body>
    <div class="app">
        <!-- Header Kasir -->
        <header class="app-header">
            <div class="header-info">
                <span class="brand-tag">SABANGDOR POS</span>
                <h1 id="page-title">Manajemen Stok & QRIS</h1>
                <p id="page-subtitle">Atur Ketersediaan Menu & Gambar QRIS Toko</p>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                <button id="btn-toggle-toko" class="btn-toggle-stok ready" onclick="toggleStatusToko()" style="padding: 4px 10px; font-size: 11px;">
                    🟢 TOKO BUKA
                </button>
                <button type="button" class="btn-primary-merchant" onclick="bukaModalKasirOrder()" style="padding: 6px 10px; font-size: 0.75rem; background: #2563EB;">
                    ➕ Pesanan Manual / Ojek
                </button>
            </div>
        </header>

        <!-- Main Body (Scroll Area) -->
        <main class="app-body">
            <!-- SECTION 1: STOK & QRIS -->
            <section id="sec-dashboard" class="page-section active">
                <div id="grid-stok-menu"></div>
            </section>

            <!-- SECTION 2: VERIFIKASI PEMBAYARAN -->
            <section id="sec-pembayaran" class="page-section">
                <div id="container-pembayaran"></div>
            </section>

            <!-- SECTION 3: DISPLAY KITCHEN -->
            <section id="sec-pantau" class="page-section">
                <div class="kitchen-tabs">
                    <button class="k-tab active" onclick="switchKitchenTab('proses-masak', event)">
                        Proses Masak (<span id="count-terkirim">0</span>)
                    </button>
                    <button class="k-tab" onclick="switchKitchenTab('selesai', event)">
                        Selesai (<span id="count-selesai">0</span>)
                    </button>
                </div>
                <div id="kanban-content-mobile"></div>
            </section>

            <!-- SECTION 5: MENU TAMBAHAN (kasir tambah menu sendiri) -->
            <section id="sec-menu" class="page-section">
                <div id="container-menu-tambahan"></div>
            </section>

            <!-- SECTION 4: RIWAYAT TRANSAKSI & OMZET -->
            <section id="sec-riwayat" class="page-section">
                <div class="card filter-card">
                    <label for="filterTanggal">📅 Filter Berdasarkan Tanggal</label>
                    <div class="filter-controls">
                        <input type="date" id="filterTanggal" onchange="renderCurrentSection(true)">
                        <button class="btn-reset" onclick="resetFilterTanggal()">Semua</button>
                    </div>
                </div>

                <div id="summary-omzet-card"></div>
                <div id="history-cards-container"></div>
            </section>
        </main>

 <!-- MODAL INPUT PESANAN KASIR (DENGAN PILIHAN UKURAN & TAMBAHAN) -->
<div id="modalKasirOrder" class="modal-backdrop" style="display:none;">
    <div class="modal-box">
        <div class="modal-header">
            <h3>🛒 Input Pesanan Manual / Kasir</h3>
            <button class="btn-close-modal" onclick="tutupModalKasirOrder()">✕</button>
        </div>
        <div class="modal-body">
            <!-- Informasi Pelanggan & Sumber -->
            <div class="mt-field">
                <label>Nama Pelanggan / No. Order Ojek:</label>
                <input type="text" id="kasirNamaPelanggan" class="mt-input" placeholder="Contoh: Budi / GF-12345" autocomplete="off">
            </div>

            <div class="mt-field">
                <label>Sumber / Layanan Pesanan:</label>
                <select id="kasirSumberPesanan" class="mt-input">
                    <option value="DINE-IN / TAKEAWAY">Takeaway / Beli Langsung</option>
                    <option value="GOFOOD">GoFood</option>
                    <option value="GRABFOOD">GrabFood</option>
                    <option value="SHOPEEFOOD">ShopeeFood</option>
                </select>
            </div>

            <!-- Pilih Menu -->
            <div class="mt-field">
                <label>Pilih Menu Utama:</label>
                <select id="kasirPilihMenu" class="mt-input" onchange="onKasirMenuChange()"></select>
            </div>

            <!-- Pilihan Ukuran / Porsi (Dirender Dinamis) -->
            <div class="mt-field">
                <label>Pilih Ukuran / Porsi:</label>
                <div id="kasirUkuranContainer" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
            </div>

            <!-- Pilihan Tambahan Opsional (Dirender Dinamis) -->
            <div class="mt-field">
                <label>Tambahan Opsional:</label>
                <div id="kasirAddonContainer" style="display: flex; flex-direction: column; gap: 6px;">
                    <span style="font-size: 11px; color: var(--text-muted);">Tidak ada tambahan opsional untuk menu ini.</span>
                </div>
            </div>

            <!-- Jumlah & Tombol Tambah -->
            <div class="mt-field" style="display: flex; gap: 8px; align-items: flex-end;">
                <div style="flex: 1;">
                    <label>Jumlah Porsi:</label>
                    <input type="number" id="kasirQtyItem" class="mt-input" value="1" min="1" style="text-align: center;">
                </div>
                <button type="button" class="btn-primary-merchant" onclick="tambahItemKeKasirCartCustom()" style="background: #10B981; height: 41px;">+ Masukkan Keranjang</button>
            </div>

            <!-- Daftar Item Terpilih -->
            <div class="mt-field" style="margin-top: 14px;">
                <label>Daftar Pesanan:</label>
                <ul id="kasirCartList" class="order-item-list" style="margin-top: 4px; max-height: 140px; overflow-y: auto;">
                    <li style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 8px;">Belum ada item dipilih.</li>
                </ul>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-weight: 800;">
                <span>Total Tagihan:</span>
                <span id="kasirTotalHargaTxt" style="color: var(--primary-red); font-size: 1.1rem;">Rp0</span>
            </div>

            <!-- Opsi Pembayaran -->
            <div class="mt-field" style="margin-top: 12px; border-top: 1px dashed var(--border-line); padding-top: 10px;">
                <label>Metode Pembayaran:</label>
                <select id="kasirMetodeBayar" class="mt-input" onchange="onChangeKasirMetodeBayar()">
                    <option value="TUNAI">TUNAI / CASH</option>
                    <option value="QRIS">E-Wallet / QRIS (Sudah Bayar)</option>
                    <option value="APLIKASI">Aplikasi Ojek Online (Sudah Bayar via App)</option>
                </select>
            </div>

            <div id="kasirBoxTunai" class="cash-input-box" style="margin-top: 8px;">
                <label>Uang Diterima (Tunai):</label>
                <input type="number" id="kasirUangDiterima" placeholder="Nominal uang tunai..." oninput="hitungKembalianKasirDirect()">
                <div id="kasirKembalianTxt" class="kembalian-txt" style="display:none;"></div>
            </div>

            <div id="kasirMsg" class="mt-msg"></div>
        </div>
        <div class="modal-footer" style="display: flex; gap: 8px; margin-top: 14px;">
            <button type="button" id="btnProsesKasirOrder" class="btn-primary-merchant" onclick="prosesSimpanPesananKasir()">🚀 Simpan & Kirim ke Dapur</button>
            <button type="button" class="btn-outline-merchant" onclick="tutupModalKasirOrder()">Batal</button>
        </div>
    </div>
</div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="tab-item active" onclick="navigate('dashboard', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <span>Stok</span>
            </button>
            <button class="tab-item" onclick="navigate('pembayaran', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                <span>Bayar</span>
                <span id="badge-notif-bayar" class="badge-count" style="display:none;">0</span>
            </button>
            <button class="tab-item" onclick="navigate('pantau', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span>Dapur</span>
            </button>
            <button class="tab-item" onclick="navigate('menu', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Menu</span>
            </button>
            <button class="tab-item" onclick="navigate('riwayat', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>Riwayat</span>
            </button>
        </nav>
    </div>
