<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Checkout & Pembayaran - Sabangdor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-pembayaran-menu.css">
</head>
<body data-step="checkout">
    <div class="app">
        <!-- Status Bar -->
        <div class="statusbar">
            <span>9:41</span>
            <div class="status-icons">
                <svg viewBox="0 0 50 11" fill="currentColor" width="40" height="11">
                    <rect x="0" y="6" width="2.5" height="4" rx=".5" />
                    <rect x="4" y="4" width="2.5" height="6" rx=".5" />
                    <rect x="8" y="2" width="2.5" height="8" rx=".5" />
                    <rect x="12" y="0" width="2.5" height="10" rx=".5" />
                    <rect x="36" y="1" width="13" height="8" rx="2.5" />
                </svg>
            </div>
        </div>

        <!-- Top Header -->
        <header class="topbar">
            <a class="back" href="keranjang.html" id="backBtn" aria-label="Kembali">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 3 5 8l5 5" />
                </svg>
            </a>
            <h1 id="pageTitle">Checkout</h1>
            <div class="topbar-right"></div>
        </header>

        <!-- Outlet Banner -->
        <div class="outlet-banner">
            <div class="outlet-left">
                <strong>SABANGDOR</strong>
                <span>Ambil di outlet</span>
            </div>
            <small id="orderInfoMeta">-</small>
        </div>

        <!-- Main Content -->
        <main class="content" id="mainContent">
            <!-- Dinamis -->
        </main>

        <!-- Sticky Footer -->
        <footer class="footer" id="footerArea">
            <!-- Dinamis -->
        </footer>

        <div class="home-indicator"></div>
    </div>

    <!-- 1. Supabase SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. File Config Supabase (Harus dimuat sebelum script-pembayaran.js) -->
    <script src="config.js"></script>

    <!-- 3. Script Pembayaran Pembeli (Cukup 1 kali di bagian paling bawah) -->
    <script src="script-pembayaran.js"></script>
</body>
</html>
