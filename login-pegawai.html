<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABANGDOR - Login Pegawai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-menu-utama.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-header">
        <h2>SABANGDOR</h2>
        <p>Akses Khusus Kasir & Dapur</p>
    </div>

    <div class="login-card-box">
        <form id="loginForm">
            <div class="login-field-group">
                <label for="email">Email Pegawai</label>
                <input type="email" id="email" class="login-input-text" placeholder="kasir@sabangdor.com" required autocomplete="off">
            </div>

            <div class="login-field-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" class="login-input-text" required>
            </div>

            <p id="errorMessage" style="color: #ef4444; font-size: 12px; margin-bottom: 12px; display: none;"></p>

            <button type="submit" id="btnSubmit" class="login-btn-submit">Masuk</button>
        </form>
    </div>

    <a href="index.html" class="login-btn-back">← Kembali ke Menu Utama</a>
</div>

<!-- 1. CDN Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Config Supabase (Diarahkan ke folder penjual-page) -->
<script src="config.js"></script>

<!-- 3. Logic Login -->
<script src="penjual-page/login.js"></script>

</body>
</html>
